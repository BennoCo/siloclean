<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiloClean</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SiloClean">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ---------- Farb-Primitive (nur hier) ---------- */
:root{
  color-scheme:light;
  --neutral-0:#FFFFFF; --neutral-50:#F3F5F3; --neutral-100:#ECEFEC; --neutral-200:#E2E6E3;
  --neutral-500:#868F8A; --neutral-600:#636D68; --neutral-700:#4F5A55; --neutral-950:#17201C;
  --teal-600:#0F7B6C; --teal-50:#E2F1EE; --red-600:#C2412D;
  --scrim-rgb:10 14 12;
}
/* ---------- Semantische Tokens (nur diese in Komponenten) ---------- */
:root{
  --color-bg:var(--neutral-50); --color-surface:var(--neutral-0); --color-fill:var(--neutral-100);
  --color-separator:var(--neutral-200); --color-border-input:var(--neutral-500);
  --color-text:var(--neutral-950); --color-text-secondary:var(--neutral-700); --color-text-tertiary:var(--neutral-600);
  --color-accent:var(--teal-600); --color-on-accent:var(--neutral-0); --color-accent-subtle:var(--teal-50);
  --color-danger:var(--red-600); --color-on-danger:var(--neutral-0);
  --color-knob:var(--neutral-0); --color-scrim:rgb(var(--scrim-rgb) / .38);
  --color-toast-bg:var(--neutral-950); --color-toast-text:var(--neutral-50);
  /* Personen: Farbe der Linie/Fläche und lesbare Initiale darauf (gemessen ≥ 4.5:1) */
  --color-person-1:#2876d4; --color-on-person-1:#FFFFFF;
  --color-person-2:#eb6834; --color-on-person-2:var(--neutral-950);
  --color-person-3:#1baf7a; --color-on-person-3:var(--neutral-950);
  --color-person-4:#eda100; --color-on-person-4:var(--neutral-950);
  --color-person-5:#e87ba4; --color-on-person-5:var(--neutral-950);
  --color-person-6:#008300; --color-on-person-6:#FFFFFF;
  --color-person-7:#6250d6; --color-on-person-7:#FFFFFF;
  --color-person-8:#ea504e; --color-on-person-8:var(--neutral-950);
  /* Flächen: Schatten für Tiefe, Rahmen nur für Struktur */
  --shadow-border:0 0 0 1px oklch(0 0 0 / .06),0 1px 2px -1px oklch(0 0 0 / .06),0 2px 4px 0 oklch(0 0 0 / .04);
  --shadow-border-hover:0 0 0 1px oklch(0 0 0 / .08),0 1px 2px -1px oklch(0 0 0 / .08),0 2px 4px 0 oklch(0 0 0 / .06);
  --shadow-lift:0 0 0 1px oklch(0 0 0 / .06),0 8px 24px -4px oklch(0 0 0 / .16);
  --image-outline:oklch(0 0 0 / .1);
  /* Typografie: Rollen mit Grösse / Zeilenhöhe / Gewicht */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --text-display:700 2rem/1.1 var(--font);
  --text-heading:600 1.0625rem/1.3 var(--font);
  --text-body:400 1rem/1.5 var(--font);
  --text-label:600 .9375rem/1.4 var(--font);
  --text-caption:400 .8125rem/1.4 var(--font);
  --text-tab:600 .75rem/1.2 var(--font);
  /* Radien: Sheet/Gruppe aussen = innen + Abstand */
  --r-sm:12px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --ease-out-quint:cubic-bezier(.2,0,0,1);
  --tabbar:calc(58px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --neutral-0:#18201D; --neutral-50:#0F1412; --neutral-100:#222B27; --neutral-200:#26302C;
    --neutral-500:#66726D; --neutral-600:#88958F; --neutral-700:#B7C1BC; --neutral-950:#EEF2F0;
    --teal-600:#3FB8A4; --teal-50:#143A33; --red-600:#E2705E;
    --color-on-accent:#06221D; --color-knob:#FFFFFF; --color-on-danger:#0F1412;
    --color-toast-bg:#EEF2F0; --color-toast-text:#0F1412;
    --color-person-1:#3987e5; --color-on-person-1:#0F1412;
    --color-person-2:#d95926; --color-on-person-2:#0F1412;
    --color-person-3:#199e70; --color-on-person-3:#0F1412;
    --color-person-4:#c98500; --color-on-person-4:#0F1412;
    --color-person-5:#d55181; --color-on-person-5:#0F1412;
    --color-person-6:#008300; --color-on-person-6:#FFFFFF;
    --color-person-7:#9085e9; --color-on-person-7:#0F1412;
    --color-person-8:#e66767; --color-on-person-8:#0F1412;
    --shadow-border:0 0 0 1px oklch(1 0 0 / .08);
    --shadow-border-hover:0 0 0 1px oklch(1 0 0 / .13);
    --shadow-lift:0 0 0 1px oklch(1 0 0 / .1),0 8px 24px -4px oklch(0 0 0 / .5);
    --image-outline:oklch(1 0 0 / .1);
  }
}

/* ---------- Basis ---------- */
*{box-sizing:border-box}
html{background:var(--color-bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  scroll-padding-block-end:calc(var(--tabbar) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;font:var(--text-body);color:var(--color-text);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation}
input{font:inherit;font-size:1rem;color:var(--color-text)}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}
svg text{font-variant-numeric:tabular-nums}
svg.ic, .tabbar svg, .round svg, .chev, .check{flex:none}
svg.ic *, .tabbar svg *, .round svg *, .chev *, .check *, .icons svg *{vector-effect:non-scaling-stroke}

main{max-width:640px;margin-inline:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(var(--tabbar) + 28px)}
.title{font:var(--text-display);letter-spacing:-.02em;margin:6px 0 16px;text-wrap:balance}
.sect{font:var(--text-label);color:var(--color-text-secondary);margin:28px 4px 8px}
.note{font:var(--text-caption);color:var(--color-text-tertiary);margin:8px 4px 0;text-wrap:pretty;max-width:65ch}
.status{background:var(--color-fill);color:var(--color-text-secondary);border-radius:var(--r-sm);padding:10px 14px;font:var(--text-caption);font-size:.875rem;margin-bottom:14px}

/* Flächen: eine Rezeptur für alle Karten */
.surface,.card,.group,.strip,.tile,.pill,.round,.whois button{
  background:var(--color-surface);border:1px solid transparent;box-shadow:var(--shadow-border)}

/* ---------- Tab-Leiste ---------- */
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:20;height:var(--tabbar);padding-bottom:env(safe-area-inset-bottom);
  display:flex;justify-content:center;background:color-mix(in srgb,var(--color-surface) 86%,transparent);
  backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--color-separator)}
.tabbar button{flex:1;max-width:180px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--color-text-tertiary);font:var(--text-tab);cursor:pointer;padding:6px 0 0}
.tabbar button svg{width:25px;height:25px}
.tabbar button[aria-selected="true"]{color:var(--color-accent)}

/* ---------- Erfassen ---------- */
.ctx{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding-block:7px;padding-inline:7px 12px;
  font:var(--text-label);cursor:pointer;min-height:42px}
.pill.plain{padding-inline-start:14px}
.pill .chev{width:14px;height:14px;color:var(--color-text-tertiary)}
.pill.other{background:var(--color-accent-subtle);border-color:var(--color-accent);box-shadow:none}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:.8125rem;font-weight:700;flex:none;line-height:1}

.strip{border-radius:var(--r-lg);padding:14px 16px;margin-bottom:18px}
.strip .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:var(--text-caption);font-size:.875rem;color:var(--color-text-secondary);margin-bottom:10px}
.strip .head b{color:var(--color-text);font-weight:600}
.stack{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--color-fill)}
.stack i{display:block;height:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font:var(--text-caption);font-size:.875rem;color:var(--color-text-secondary)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys b{color:var(--color-text);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;border-radius:var(--r-lg);padding:14px 14px 12px;min-height:116px;text-align:start;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  transition-property:box-shadow,scale;transition-duration:150ms;transition-timing-function:ease-out}
.tile .ic{width:28px;height:28px;color:var(--color-accent)}
.tile .nm{font:var(--text-label);hyphens:auto;overflow-wrap:break-word;text-wrap:balance}
.tile .cr{font:var(--text-caption);color:var(--color-text-tertiary);font-variant-numeric:tabular-nums}
.tile .ok{position:absolute;inset:-1px;border-radius:inherit;background:var(--color-accent);color:var(--color-on-accent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;
  opacity:0;pointer-events:none;transition:opacity 150ms ease-out}
.tile .ok svg{width:30px;height:30px;opacity:0;transition:opacity 300ms var(--ease-out-quint)}
.tile.done .ok{opacity:1}
.tile.done .ok svg{opacity:1}
.tile:disabled{opacity:.5}

/* ---------- Listen ---------- */
.group{border-radius:var(--r-lg);overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border:0;background:var(--color-surface);width:100%;text-align:start;position:relative;
  font:var(--text-body);transition:background-color 100ms ease-out}
.lrow+.lrow::before{content:"";position:absolute;top:0;inset-inline:14px 0;border-top:1px solid var(--color-separator)}
.lrow.tap{cursor:pointer}
.lrow.tap:active{background:var(--color-fill)}
.lrow .grow{flex:1;min-width:0;overflow-wrap:break-word}
.lrow .sub{font:var(--text-caption);color:var(--color-text-tertiary)}
.lrow .val{color:var(--color-text-tertiary);font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow .chev{width:16px;height:16px;color:var(--color-text-tertiary)}
.lrow .ic{width:22px;height:22px;color:var(--color-accent);flex:none}
.lrow.off .grow,.lrow.off .ic{opacity:.5}
.lrow.add{color:var(--color-accent);font-weight:600}
.lrow.danger{color:var(--color-danger);justify-content:center;font-weight:600}
.handle{width:34px;height:40px;margin-block:-6px;margin-inline:-8px -6px;display:grid;place-items:center;color:var(--color-text-tertiary);touch-action:none;cursor:grab;flex:none;border:0;background:none;user-select:none}
.handle svg{width:20px;height:20px}
.lrow.sorting{transition:translate 150ms ease-out}
.lrow.dragging{z-index:5;box-shadow:var(--shadow-lift);transition:none}
.tag{font:var(--text-caption);font-size:.75rem;color:var(--color-text-tertiary);background:var(--color-fill);border-radius:6px;padding:1px 6px;margin-inline-start:6px;white-space:nowrap}
.mini{border:0;background:none;color:var(--color-text-tertiary);font:var(--text-label);font-size:.875rem;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;
  transition:background-color 150ms ease-out,color 150ms ease-out}
.mini.confirm{color:var(--color-on-danger);background:var(--color-danger)}

/* ---------- Auswertung ---------- */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 14px}
.monthbar strong{font:var(--text-heading)}
.round{width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--color-text);flex:none}
.round svg{width:18px;height:18px}
.round:disabled{opacity:.35;cursor:default}
.card{border-radius:var(--r-lg);padding:16px}
.person{padding:12px 0}
.person+.person{border-top:1px solid var(--color-separator)}
.person .row1{display:flex;align-items:center;gap:10px}
.person .row1 .nm{font-weight:600;flex:1;min-width:0}
.person .big{font-size:1.375rem;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
.person .pct{color:var(--color-text-tertiary);font:var(--text-caption);font-size:.875rem;min-width:3em;text-align:end;font-variant-numeric:tabular-nums}
.person .row2{display:flex;flex-wrap:wrap;gap:4px 14px;font:var(--text-caption);color:var(--color-text-secondary);margin-block-start:6px;margin-inline-start:36px}
.dev{display:grid;grid-template-columns:1fr 1fr;height:6px;margin-block-start:10px;margin-inline-start:36px;position:relative}
.dev::after{content:"";position:absolute;inset-inline-start:50%;top:-3px;bottom:-3px;border-inline-start:1px solid var(--color-text-tertiary)}
.dev .l{display:flex;justify-content:flex-end}
.dev i{display:block;height:100%}
.dev .l i{border-start-start-radius:3px;border-end-start-radius:3px}.dev .r i{border-start-end-radius:3px;border-end-end-radius:3px}
.top{display:grid;gap:14px}
.top h3{font:var(--text-label);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.top .it{display:flex;align-items:center;gap:10px;padding:5px 0}
.top .it .ic{width:20px;height:20px;color:var(--color-accent);flex:none}
.top .it .grow{flex:1;min-width:0}
.top .it .val{color:var(--color-text-tertiary);font:var(--text-caption);font-size:.875rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--color-text-tertiary);text-align:center;padding:20px 8px;text-wrap:balance}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:var(--text-caption);color:var(--color-text-secondary);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--color-surface);border:1px solid transparent;border-radius:var(--r-sm);padding:8px 10px;font:var(--text-caption);box-shadow:var(--shadow-lift);min-width:140px;z-index:3}
.tip .t{font-weight:700;margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .r span{display:inline-flex;align-items:center;gap:6px;color:var(--color-text-secondary)}
details{margin-top:10px}
summary{cursor:pointer;color:var(--color-text-secondary);font:var(--text-label);font-size:.875rem}
table{border-collapse:collapse;width:100%;font:var(--text-caption);font-size:.875rem;margin-top:8px;font-variant-numeric:tabular-nums}
th,td{padding:6px;border-bottom:1px solid var(--color-separator);text-align:end}
th:first-child,td:first-child{text-align:start}
th{color:var(--color-text-tertiary);font-weight:600}

/* ---------- Blatt (Sheet) ---------- */
.backdrop{position:fixed;inset:0;background:var(--color-scrim);z-index:40;opacity:0;transition:opacity 200ms ease-out}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;background:var(--color-bg);border-start-start-radius:var(--r-xl);border-start-end-radius:var(--r-xl);
  max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  padding:8px 16px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin-inline:auto;
  opacity:0;transition:opacity 150ms ease-out}
.sheet.open{opacity:1}.backdrop.open{opacity:1}
.grab{width:38px;height:5px;border-radius:3px;background:var(--color-separator);margin:4px auto 10px}
.shead{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) minmax(0,auto);align-items:center;gap:8px;margin-bottom:14px}
.shead h2{font:var(--text-heading);margin:0;text-align:center;text-wrap:balance}
.shead .end{justify-self:end}
.textbtn{border:0;background:none;color:var(--color-accent);font:var(--text-label);font-size:1rem;cursor:pointer;padding:8px 2px;min-height:44px}
.field{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px}
.field .lbl{flex:0 0 auto;min-width:6rem;color:var(--color-text-secondary)}
.field .lbl.grow{flex:1;min-width:0;color:var(--color-text)}
.field input[type=text],.field input[type=date]{flex:1;min-width:0;border:0;background:none;padding:8px 0;outline:none}
.field input[type=text]:focus-visible,.field input[type=date]:focus-visible{outline:none}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--color-accent)}
.field+.field{border-top:1px solid var(--color-separator)}
.stepper{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--color-fill);font-size:1.25rem;cursor:pointer;line-height:1}
.stepper input{width:3.5em;text-align:center;border:1px solid var(--color-border-input);border-radius:10px;background:var(--color-surface);font-weight:700;font-size:1.125rem;padding:6px 4px;font-variant-numeric:tabular-nums}
.switch{margin-inline-start:auto;width:51px;height:31px;border-radius:16px;background:var(--color-border-input);border:0;position:relative;cursor:pointer;flex:none;
  transition:background-color 150ms ease-out}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:var(--color-knob);box-shadow:0 1px 3px oklch(0 0 0 / .25);transition:translate 200ms var(--ease-out-quint)}
.switch[aria-checked="true"]{background:var(--color-accent)}
.switch[aria-checked="true"]::after{translate:20px 0}
[dir="rtl"] .switch[aria-checked="true"]::after{translate:-20px 0}
.group.iconpick{border-radius:var(--r-xl)}  /* 12px Abstand + 12px Knopfradius */
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:12px}
.icons button{aspect-ratio:1;border:0;border-radius:var(--r-sm);background:var(--color-fill);color:var(--color-text-secondary);display:grid;place-items:center;cursor:pointer;
  transition:background-color 150ms ease-out,color 150ms ease-out}
.icons button svg{width:24px;height:24px}
.icons button[aria-pressed="true"]{background:var(--color-accent);color:var(--color-on-accent)}
.primary{width:100%;border:0;border-radius:var(--r-md);background:var(--color-accent);color:var(--color-on-accent);font:var(--text-heading);min-height:52px;cursor:pointer;margin-top:18px}
.primary:disabled{opacity:.5}
.check{width:22px;height:22px;color:var(--color-accent);margin-inline-start:auto}

/* ---------- PIN / Erster Start ---------- */
.center{max-width:360px;margin:9vh auto 0;text-align:center}
.center .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 18px;display:block;outline:1px solid var(--image-outline);outline-offset:-1px}
.center h1{font:var(--text-display);font-size:1.75rem;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.center p{color:var(--color-text-secondary);margin:0 0 22px;text-wrap:balance}
.pinbox{width:100%;text-align:center;font-size:1.5rem;letter-spacing:.25em;border:1px solid var(--color-border-input);border-radius:var(--r-md);background:var(--color-surface);padding:14px;font-variant-numeric:tabular-nums}
.err{color:var(--color-danger);min-height:22px;font:var(--text-caption);font-size:.875rem;margin-top:10px}
.whois{display:grid;gap:10px;margin-top:8px}
.whois button{display:flex;align-items:center;gap:12px;border-radius:var(--r-lg);padding:14px;font:var(--text-heading);cursor:pointer;text-align:start}
.whois .av{width:36px;height:36px;font-size:1rem}

/* ---------- Toast ---------- */
.toast{position:fixed;inset-inline-start:50%;bottom:calc(var(--tabbar) + 12px);translate:-50% 0;z-index:30;background:var(--color-toast-bg);color:var(--color-toast-text);
  padding-block:10px;padding-inline:16px 10px;border-radius:var(--r-md);display:flex;align-items:center;gap:12px;font:var(--text-body);font-size:.9375rem;box-shadow:var(--shadow-lift);
  width:max-content;max-width:calc(100% - 32px)}
.toast button{border:0;background:color-mix(in srgb,var(--color-toast-text) 16%,transparent);color:inherit;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.busy{opacity:.6;pointer-events:none}

/* ---------- Hover nur mit Maus/Trackpad ---------- */
@media (hover: hover){
  .tile:not(:disabled):hover,.pill:hover,.round:not(:disabled):hover,.whois button:hover{box-shadow:var(--shadow-border-hover)}
  .lrow.tap:hover{background:var(--color-fill)}
  .icons button:not([aria-pressed="true"]):hover{color:var(--color-text)}

/* ---------- Bewegung: nur ohne «Bewegung reduzieren» ---------- */
@media (prefers-reduced-motion: no-preference){

  .tile:not(:disabled):active,.pill:active,.round:not(:disabled):active,.primary:not(:disabled):active,.whois button:active,

const $ = s => document.querySelector(s);
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (v==null||v===false) continue;
    if (k==='class') e.className=v; else if (k==='text') e.textContent=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if (k==='value') e.value=v; else e.setAttribute(k, v===true?'':v);

  return e;
}
const NS='http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids){ const e=document.createElementNS(NS,tag);

const pad=n=>String(n).padStart(2,'0');

const shiftDay=(ds,n)=>{const [y,m,d]=ds.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());};
const curMonth=()=>todayStr().slice(0,7);
function addMonths(ym,n){let [y,m]=ym.split('-').map(Number);const i=y*12+(m-1)+n;return Math.floor(i/12)+'-'+pad(i%12+1);}
const lastDay=ym=>{const [y,m]=ym.split('-').map(Number);return ym+'-'+pad(new Date(y,m,0).getDate());};
const mName=(ym,opt)=>{const [y,m]=ym.split('-').map(Number);return new Intl.DateTimeFormat('de-CH',opt).format(new Date(y,m-1,1));};
const fmtMonthLong=ym=>mName(ym,{month:'long',year:'numeric'});
const fmtMonth=ym=>mName(ym,{month:'long'});
const fmtMonthShort=ym=>mName(ym,{month:'short'}).replace('.','');
const fmtDay=ds=>{const [y,m,d]=ds.split('-').map(Number);return new Intl.DateTimeFormat('de-CH',{weekday:'short'}).format(new Date(y,m-1,d)).replace('.','')+' '+d+'.'+m+'.';};
const fmtNum=n=>new Intl.NumberFormat('de-CH',{maximumFractionDigits:1}).format(Number(n)||0);
const signed=n=>(n>0?'+':n<0?'−':'±')+fmtNum(Math.abs(n));
const dayLabel=ds=>ds===todayStr()?'Heute':ds===shiftDay(todayStr(),-1)?'Gestern':fmtDay(ds);
const pIdx=m=>((m?(Math.round(Number(m.sort))||0):0)%8+1);
const color=m=>'var(--color-person-'+pIdx(m)+')';
const onColor=m=>'var(--color-on-person-'+pIdx(m)+')';
const initial=m=>((m&&m.name)||'?').trim().charAt(0).toUpperCase();

// ---------- API ----------
class ApiError extends Error{constructor(code){super(code);this.code=code;}}
async function api(fn,args={}){
  let res; try{ res=await sb.rpc(fn,{p_pin:S.pin,...args}); }catch{ throw new ApiError('network'); }
  const {data,error}=res;
  if(error) throw new ApiError('network');
  if(data&&data.error){ if(data.error==='bad_pin'){ S.pin=null; ls.set('pin',null); showPin('Der PIN wurde geändert. Bitte neu eingeben.'); } throw new ApiError(data.error); }
  return data;
}
function errMsg(e){ const c=(e&&e.code)||'network';
  return {locked:'Zu viele falsche PIN-Eingaben. In 15 Minuten wieder versuchen.',
    network:'Keine Verbindung. Prüfe das Internet und versuche es nochmals.',
    bad_date:'Dieses Datum ist nicht möglich.', bad_name:'Bitte einen Namen mit höchstens 60 Zeichen eingeben.',

    bad_pin:null}[c] ?? 'Speichern fehlgeschlagen. Bitte nochmals versuchen.'; }
function status(msg){ const el=$('#status'); el.hidden=!msg; if(msg) el.textContent=msg; }
async function load(){
  if(!S.pin) return;
  try{
    const d=await api('pd_load',{p_from:addMonths(S.month,-11)+'-01',p_to:lastDay(curMonth())});
    Object.assign(S,{members:d.members,chores:d.chores,recent:d.recent,range:d.entries.map(e=>({...e,month:e.done_on.slice(0,7)})),loaded:true});
    status(null); renderAll();
  }catch(e){ const m=errMsg(e); if(m) status(m); }
}
async function run(fn,args){
  try{ const r=await api(fn,args); await load(); return r; }
  catch(e){ const m=errMsg(e); if(m) status(m); if(e.code==='not_found') load(); return null; }
}

  el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,5000); }

function openSheet(title, build, {action}={}){
  if(S.sheetOpen) closeSheet(true);

    action?h('button',{class:'textbtn end',text:action.label,onclick:action.run}):h('span',{'aria-hidden':'true'})));
  build(sh, close);
  bd.addEventListener('click',close);
  document.body.append(bd,sh);
  requestAnimationFrame(()=>{bd.classList.add('open');sh.classList.add('open');});

}
function closeSheet(instant){ const s=S._sheet; if(!s) return; S._sheet=null; S.sheetOpen=false;

function renderAll(){
  if(!S.pin) return;
  if(S.loaded && S.members.some(m=>m.active) && !S.members.find(m=>m.id===S.me&&m.active) && !S.skipMe){ showMe(); return; }

// ---------- PIN ----------
function showPin(msg){
  $('#tabbar').hidden=true; showOnly('pin'); S.loaded=false;
  const inp=h('input',{class:'pinbox',type:'password',autocomplete:'current-password','aria-label':'Haushalts-PIN'});
  const err=h('div',{class:'err',text:msg||''}); const btn=h('button',{class:'primary',text:'Entsperren'});
  const go=async()=>{ const p=inp.value.trim(); if(!p) return; btn.classList.add('busy'); err.textContent='';
    try{ let res; try{ res=await sb.rpc('pd_login',{p_pin:p}); }catch{ throw new ApiError('network'); }
      if(res.error) throw new ApiError('network'); if(res.data&&res.data.error) throw new ApiError(res.data.error);
      S.pin=p; ls.set('pin',p); setTab(S.tab); load();
    }catch(e){ err.textContent=e.code==='bad_pin'?'Dieser PIN stimmt nicht.':errMsg(e); }
    finally{ btn.classList.remove('busy'); } };
  btn.addEventListener('click',go); inp.addEventListener('keydown',e=>{if(e.key==='Enter') go();});
  $('#view-pin').replaceChildren(h('div',{class:'center stagger'},

function monthTotals(ym){ const t={}; for(const e of S.range) if(e.month===ym) t[e.member_id]=(t[e.member_id]||0)+Number(e.credits||0); return t; }
function renderErfassen(){
  const root=$('#view-erfassen'); root.replaceChildren(h('h1',{class:'title',text:'Erfassen'}));

  if(!act.length){ root.append(h('div',{class:'card empty'},'Noch keine Personen. ',h('button',{class:'textbtn',text:'Person hinzufügen',onclick:()=>{setTab('einstellungen');editMember(null);}}))); return; }
  if(!act.find(m=>m.id===S.who)) S.who=(act.find(m=>m.id===S.me)||act[0]).id;
  const who=act.find(m=>m.id===S.who), isOther=S.me&&S.who!==S.me;

  root.append(h('div',{class:'strip'},

  root.append(h('div',{class:'monthbar'},
    h('button',{class:'round','aria-label':'Vormonat',onclick:()=>changeMonth(-1)}, svgIcon(UI.chevL,'',2.2)),
    h('strong',{text:fmtMonthLong(S.month)}),
    h('button',{class:'round','aria-label':'Nächster Monat',disabled:S.month>=curMonth()||null,onclick:()=>changeMonth(1)}, svgIcon(UI.chevR,'',2.2))));
  if(!S.loaded){ root.append(h('div',{class:'empty',text:'Daten werden geladen …'})); return; }

  const tot=monthTotals(S.month), prevYm=addMonths(S.month,-1), prev=monthTotals(prevYm);
  const ppl=S.members.filter(m=>m.active||tot[m.id]);
  const sum=Object.values(tot).reduce((a,b)=>a+b,0);
  const nActive=Math.max(1,S.members.filter(m=>m.active).length);
  const fair=sum/nActive;

    const v=tot[m.id]||0, d=v-fair, pv=prev[m.id]||0, pct=sum?Math.round(v/sum*100):0;

      list.map(([name,x])=>h('div',{class:'it'}, choreIcon(S.chores.find(c=>c.name===name)), h('span',{class:'grow',text:name}), h('span',{class:'val num',text:`${x.n}×, ${fmtNum(x.c)}\u00a0Credits`})))));

function niceMax(v){ if(v<=0) return {max:4,step:1}; const raw=v/4,p=10**Math.floor(Math.log10(raw)),f=raw/p; const step=(f<=1?1:f<=2?2:f<=5?5:10)*p; return {max:step*4,step}; }
function renderChart(host){
  const months=[]; for(let i=11;i>=0;i--) months.push(addMonths(S.month,-i));
  const withData=new Set(S.range.map(e=>e.member_id));
  const persons=S.members.filter(m=>m.active||withData.has(m.id));
  if(!persons.length){ host.append(h('div',{class:'empty',text:'Keine Daten.'})); return; }
  const totals=months.map(monthTotals), series=persons.map(m=>({m,vals:totals.map(t=>t[m.id]||0)}));
  const {max:yMax,step:yStep}=niceMax(Math.max(0,...series.flatMap(s=>s.vals)));
  const direct=series.length>1&&series.length<=4;
  const W=Math.max(300,Math.round(host.clientWidth-32)||600), H=W<500?220:250, M={l:34,r:direct?(W<500?62:90):12,t:10,b:28};

  if(series.length>1) host.append(h('div',{class:'legend'}, series.map(s=>h('span',{}, h('i',{style:'background:'+color(s.m)}), s.m.name))));
  const wrap=h('div',{class:'chartwrap'}); host.append(wrap);
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'Credits pro Person in den letzten 12 Monaten'});
  for(let v=0;v<=yMax+1e-9;v+=yStep){ svg.append(sv('line',{x1:M.l,x2:M.l+pw,y1:Y(v),y2:Y(v),stroke:'var(--color-separator)'}));
    svg.append(sv('text',{x:M.l-8,y:Y(v)+4,'text-anchor':'end','font-size':11,fill:'var(--color-text-tertiary)'},fmtNum(v))); }
  months.forEach((ym,i)=>{ if(W<500&&(11-i)%2) return;
    svg.append(sv('text',{x:X(i),y:H-8,'text-anchor':'middle','font-size':11,fill:'var(--color-text-tertiary)'}, fmtMonthShort(ym)+(ym.endsWith('-01')?' '+ym.slice(2,4):''))); });
  for(const s of series){ svg.append(sv('path',{d:s.vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' '),fill:'none',stroke:color(s.m),'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    svg.append(sv('circle',{cx:X(11),cy:Y(s.vals[11]),r:4,fill:color(s.m),stroke:'var(--color-surface)','stroke-width':2})); }
  if(direct){ const labs=series.map(s=>({s,y:Y(s.vals[11])})).sort((a,b)=>a.y-b.y);
    for(let i=1;i<labs.length;i++) if(labs[i].y-labs[i-1].y<14) labs[i].y=labs[i-1].y+14;
    const over=labs[labs.length-1].y-(M.t+ph); if(over>0) labs.forEach(l=>l.y-=over);
    labs.forEach(l=>svg.append(sv('text',{x:X(11)+10,y:l.y+4,'font-size':12,fill:'var(--color-text-secondary)'},l.s.m.name))); }
  const cross=sv('line',{y1:M.t,y2:M.t+ph,stroke:'var(--color-text-tertiary)','stroke-dasharray':'3 3',visibility:'hidden'}), hd=sv('g',{visibility:'hidden'});
  const hit=sv('rect',{x:M.l-10,y:M.t,width:pw+20,height:ph,fill:'transparent'});
  svg.append(cross,hd,hit); wrap.append(svg);
  const tip=h('div',{class:'tip',hidden:true}); wrap.append(tip);
  const show=ev=>{ const r=svg.getBoundingClientRect(); let i=Math.round(((ev.clientX-r.left)*W/r.width-M.l)/(pw/11)); i=Math.max(0,Math.min(11,i));

    const rows=[...series].sort((a,b)=>b.vals[i]-a.vals[i]);

    tip.hidden=false; const px=X(i)*r.width/W, tw=tip.offsetWidth; let left=px+14; if(left+tw>r.width) left=px-14-tw; tip.style.left=Math.max(0,left)+'px'; tip.style.top='6px'; };

  hit.addEventListener('pointerleave',()=>{tip.hidden=true;cross.setAttribute('visibility','hidden');hd.setAttribute('visibility','hidden');});

    h('table',{}, h('thead',{}, h('tr',{}, h('th',{text:'Monat'}), series.map(s=>h('th',{text:s.m.name})))),

let rz=null; window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.pin&&S.tab==='auswertung')renderAuswertung();},200);});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.pin){ if(!S.dateTouched) S.date=todayStr(); load(); } });
setInterval(()=>{ if(document.visibilityState==='visible'&&S.pin&&!S.busy&&!S.sheetOpen&&!S.dragging) load(); },30000);

if(SUPABASE_URL.includes('DEIN-PROJEKT')) status('Konfiguration fehlt: SUPABASE_URL und SUPABASE_KEY oben in index.html eintragen.');
else if(!S.pin) showPin();
else { setTab(S.tab); load(); }
